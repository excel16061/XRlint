<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <!-- The opaque "door" is not a ray target, so clicks on it reach the ad behind it. -->
  <a-scene>
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor raycaster="objects: .clickable" position="0 0 -1"></a-entity>
    </a-entity>
    <a-plane id="door" position="0 1.5 -3" width="2" height="2" color="#8B5A2B"></a-plane>
    <a-box class="clickable" id="promo" position="0 1.5 -4" width="0.8" height="0.8" depth="0.2"></a-box>
  </a-scene>
</body>
</html>
