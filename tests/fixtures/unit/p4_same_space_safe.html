<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor raycaster="objects: .clickable" position="0 0 -1"></a-entity>
    </a-entity>
    <a-box class="clickable" id="left" position="-1 1.4 -3"></a-box>
    <a-box id="right" position="1 1.4 -3" color="gold"></a-box>
  </a-scene>
</body>
</html>
