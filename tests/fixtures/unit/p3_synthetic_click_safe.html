<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-entity camera look-controls position="0 1.6 0"></a-entity>
    <a-box id="crate" position="2 1 -4" color="#FFC65D"></a-box>
  </a-scene>
  <script>
    // Custom app event, not an input event.
    setTimeout(function () {
      document.querySelector('#crate').emit('crate-opened', {coins: 3});
    }, 10000);
  </script>
</body>
</html>
