<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor="fuse: true; fuseTimeout: 1000" raycaster="objects: .clickable" position="0 0 -1"></a-entity>
    </a-entity>
    <a-box class="clickable" position="0 1.5 -3"></a-box>
  </a-scene>
</body>
</html>
