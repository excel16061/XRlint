<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .target">
    <a-entity camera look-controls position="0 1.6 0"></a-entity>
    <a-sphere class="target" id="target" position="0 1.5 -4" radius="0.4" color="red"></a-sphere>
  </a-scene>
  <script>
    var score = 0;
    var target = document.querySelector('#target');
    target.addEventListener('click', function () {
      score += 1;
    });
  </script>
</body>
</html>
