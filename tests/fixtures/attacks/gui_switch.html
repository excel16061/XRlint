<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GUI switch</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // First-party game logic (typical, unvalidated handler).
    AFRAME.registerComponent('game-target', {
      init: function () {
        this.el.addEventListener('click', function () { window.gameScore = (window.gameScore || 0) + 1; });
      }
    });
  </script>
</head>
<body>
  <a-scene>
    <a-entity camera look-controls position="0 1.6 0"></a-entity>
    <a-box game-target position="0 1.5 -3"></a-box>
  </a-scene>
  <!-- Third-party code. In a real deployment this would be served by the ad network. -->
  <script src="js/gui-switch-sdk.js"></script>
</body>
</html>
