<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Intercepting user inputs</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // First-party game logic (typical, unvalidated handler).
    AFRAME.registerComponent('game-target', {
      init: function () {
        this.el.addEventListener('click', function () { window.gameScore = (window.gameScore || 0) + 1; });
      }
    });
  </script>
</head>
<body>
  <a-scene>
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor raycaster="objects: .key" position="0 0 -1"></a-entity>
    </a-entity>
    <a-entity id="pinpad" position="0 1.5 -2">
      <a-plane class="key" data-digit="1" position="-0.3 0.3 0" width="0.25" height="0.25"></a-plane>
      <a-plane class="key" data-digit="2" position="0 0.3 0" width="0.25" height="0.25"></a-plane>
      <a-plane class="key" data-digit="3" position="0.3 0.3 0" width="0.25" height="0.25"></a-plane>
      <a-plane class="key" data-digit="4" position="-0.3 0 0" width="0.25" height="0.25"></a-plane>
    </a-entity>
  </a-scene>
  <!-- Third-party code. In a real deployment this would be served by the ad network. -->
  <script src="js/intercepting-inputs-sdk.js"></script>
</body>
</html>
