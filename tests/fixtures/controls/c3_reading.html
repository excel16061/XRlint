<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <title>Comic reader (benign)</title>
  <script>
    AFRAME.registerComponent('page-flipper', {
      init: function () {
        var pages = ['#p1', '#p2', '#p3'];
        var i = 0;
        var el = this.el;
        el.addEventListener('click', function () {
          i = (i + 1) % pages.length;
          el.setAttribute('src', pages[i]);
        });
      }
    });
  </script>
</head>
<body>
  <a-scene>
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor="fuse: true; fuseTimeout: 1500" raycaster="objects: .page" position="0 0 -1"></a-entity>
    </a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .page"></a-entity>
    <a-image class="page" page-flipper position="0 1.6 -2" width="1.4" height="2" src="#p1"></a-image>
  </a-scene>
</body>
</html>
